<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🧠 Jogo da Memória</h1>
    <div class="controls">
      <label for="difficulty">Dificuldade:</label>
      <select id="difficulty">
        <option value="6">Fácil (6 pares)</option>
        <option value="8">Médio (8 pares)</option>
        <option value="12">Difícil (12 pares)</option>
      </select>

      <label for="mode">Modo:</label>
      <select id="mode">
        <option value="solo">Solo</option>
        <option value="multi">Multijogador</option>
      </select>

      <button id="startBtn">Iniciar Jogo</button>
    </div>
    <div class="status">
      <p id="timer">⏱️ 00:00</p>
      <p id="moves">Movimentos: 0</p>
      <p id="score">Pontuação: 0</p>
      <p id="turn"></p>
    </div>
  </header>

  <main>
    <section id="game-board" class="board"></section>
  </main>

  <footer>
    <p>Jogo da Memória em HTML, CSS e JS • Desenvolvido em equipe</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
