<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Memória Feio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Jogo da Memória</h1>

  <div>
    <label for="difficulty">Dificuldade:</label>
    <select id="difficulty">
      <option value="6">Fácil</option>
      <option value="8">Médio</option>
      <option value="12">Difícil</option>
    </select>

    <label for="mode">Modo:</label>
    <select id="mode">
      <option value="solo">Solo</option>
      <option value="multi">Multijogador</option>
    </select>

    <button id="startBtn">Iniciar</button>
    <button id="contrastToggle">Contraste</button>
  </div>

  <div>
    <p id="timer">00:00</p>
    <p id="moves">Movimentos: 0</p>
    <p id="score">Pontuação: 0</p>
    <p id="turn"></p>
  </div>

  <div id="game-board"></div>

  <script src="script.js"></script>
</body>
</html>
